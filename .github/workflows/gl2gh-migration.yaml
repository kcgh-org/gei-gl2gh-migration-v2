name: GitLab to GitHub Migration Pipeline

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT_NAME:
        description: "Environment containing migration secrets and variables"
        type: string
        default: "gl2gh-migration-secrets"
        required: false

      INVENTORY_FILE:
        description: "Inventory CSV file"
        type: string
        default: "projects.csv"
        required: false

      APPROVAL_ENVIRONMENT_NAME:
        description: "Approval environment"
        type: string
        default: "gl2gh-migration-approvers"
        required: false

      USE_SELF_HOSTED_RUNNER:
        description: "Use Self-Hosted Runner"
        type: choice
        options:
          - "true"
          - "false"
        default: "false"
        required: false

      SELF_HOSTED_RUNNER_LABEL:
        description: "Self-Hosted Runner Label"
        type: string
        default: ""
        required: false

      RUN_MIGRATION_READINESS:
        description: "Run migration readiness check"
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
        required: false

permissions:
  contents: read
  actions: read

env:
  DEBIAN_FRONTEND: "noninteractive"
  CI_PROJECT_DIR: ${{ github.workspace }}

jobs:
  # ------------------------------------------------------------
  # 1) Environment Validation
  # ------------------------------------------------------------
  env-validation:
    name: env-validation
    runs-on: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && inputs.SELF_HOSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && 7200 || 360 }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}

    env:
      USE_SELF_HOSTED_RUNNER: ${{ inputs.USE_SELF_HOSTED_RUNNER }}
      SELF_HOSTED_RUNNER_LABEL: ${{ inputs.SELF_HOSTED_RUNNER_LABEL }}

      GITLAB_SERVER_URL: ${{ vars.GITLAB_SERVER_URL }}
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}

      TARGET_GITHUB_API_URL: ${{ vars.TARGET_GITHUB_API_URL }}
      GH_PAT: ${{ secrets.GH_PAT }}

      STORAGE_TYPE: ${{ vars.STORAGE_TYPE }}

      TARGET_UPLOAD_URL: ${{ vars.TARGET_UPLOAD_URL }}

      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

      AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate runtime inputs, secrets, storage, and scripts
        shell: bash
        run: |
          echo "Runner: $RUNNER_NAME | OS: $RUNNER_OS"
          echo "====================================="
          echo "# 1) Environment Validation"
          echo "====================================="
          set -euo pipefail

          TARGET_GITHUB_API_URL="${TARGET_GITHUB_API_URL:-https://api.github.com}"

          VALIDATION_FAILED=0

          print_ok() {
            echo "✅ $1"
          }

          print_fail() {
            echo "❌ $1"
            VALIDATION_FAILED=1
          }

          print_info() {
            echo "ℹ️  $1"
          }

          echo ""
          echo "Checking required secrets..."
          echo "----------------------------"

          if [[ -n "${GITLAB_PAT:-}" ]]; then
            print_ok "GITLAB_PAT is configured"
          else
            print_fail "GITLAB_PAT is missing in GitHub Environment secrets"
          fi

          if [[ -n "${GH_PAT:-}" ]]; then
            print_ok "GH_PAT is configured"
          else
            print_fail "GH_PAT is missing in GitHub Environment secrets"
          fi

          echo "Checking environment variables..."
          echo "--------------------------------"

          if [[ -n "${GITLAB_SERVER_URL:-}" ]]; then
            print_ok "GITLAB_SERVER_URL is configured: ${GITLAB_SERVER_URL}"
          else
            print_info "GITLAB_SERVER_URL is not configured. Defaulting to https://gitlab.com"
          fi

          echo ""
          echo "Checking runtime inputs..."
          echo "--------------------------"

          if [[ -n "${TARGET_GITHUB_API_URL:-}" ]]; then
            print_ok "TARGET_GITHUB_API_URL variable is configured: ${TARGET_GITHUB_API_URL}"
          else
            print_fail "TARGET_GITHUB_API_URL GitHub variable is not configured"
          fi

          if [[ -n "${INVENTORY_FILE:-}" ]]; then
            print_ok "INVENTORY_FILE is provided: ${INVENTORY_FILE}"
          else
            print_fail "INVENTORY_FILE is required"
          fi

          echo ""
          echo "Checking GitHub API URL..."
          echo "--------------------------"

          if [[ -z "${TARGET_GITHUB_API_URL:-}" ]]; then
            print_fail "TARGET_GITHUB_API_URL is empty"
          elif [[ "${TARGET_GITHUB_API_URL}" =~ ^https://api\.github\.com/?$ ]]; then
            print_ok "GitHub API URL is valid for GitHub Enterprise Cloud"
            print_info "Migration destination: GitHub Enterprise Cloud"
          elif [[ "${TARGET_GITHUB_API_URL}" =~ ^https://api\.[a-zA-Z0-9.-]+\.ghe\.com/?$ ]]; then
            print_ok "GitHub API URL is valid for GitHub Enterprise Cloud Data Residency"
            print_info "Migration destination: GitHub Enterprise Cloud Data Residency"
          else
            print_fail "Invalid TARGET_GITHUB_API_URL: ${TARGET_GITHUB_API_URL}"
            print_info "Expected values:"
            print_info " - https://api.github.com"
            print_info " - https://api.<SUBDOMAIN>.ghe.com"
          fi

          echo ""
          echo "Checking inventory file..."
          echo "--------------------------"

          if [[ -n "${INVENTORY_FILE:-}" && -f "${INVENTORY_FILE}" ]]; then
            print_ok "Inventory file exists: ${INVENTORY_FILE}"
          else
            print_fail "Inventory file not found: ${INVENTORY_FILE:-not set}"
          fi

          if [[ -n "${INVENTORY_FILE:-}" && -s "${INVENTORY_FILE}" ]]; then
            print_ok "Inventory file is not empty"
            echo ""
            echo "Checking inventory file headers..."
            echo "----------------------------------"
            HEADER="$(head -n 1 "$INVENTORY_FILE" | tr -d '\r')"
            REQUIRED_COLUMNS=(
              "group-path"
              "project"
              "url"
              "github_org"
              "github_repo"
              "gh_repo_visibility"
            )
            for col in "${REQUIRED_COLUMNS[@]}"; do
              if echo "$HEADER" | tr ',' '\n' | sed 's/^"//;s/"$//;s/^ *//;s/ *$//' | grep -Fxq "$col"; then
                print_ok "Required inventory column found: $col"
              else
                print_fail "Required inventory column missing: $col"
              fi
            done
            REPO_COUNT=$(($(wc -l < "$INVENTORY_FILE") - 1))
            print_ok "Inventory contains ${REPO_COUNT} repository entries"
          else
            print_fail "Inventory file is empty or unavailable"
          fi

          if [[ "${USE_SELF_HOSTED_RUNNER}" == "true" ]]; then
            if [[ -z "${SELF_HOSTED_RUNNER_LABEL}" ]]; then
              print_fail "SELF_HOSTED_RUNNER_LABEL is required when USE_SELF_HOSTED_RUNNER=true"
            else
              print_ok "Using self-hosted runner label: ${SELF_HOSTED_RUNNER_LABEL}"
            fi
          else
            print_ok "Using GitHub-hosted runner: ubuntu-latest"
          fi

          echo ""
          echo "Checking required scripts..."
          echo "----------------------------"

          if [[ -f "./1_migration_readiness_check.sh" ]]; then
            print_ok "1_migration_readiness_check.sh exists"
          else
            print_fail "1_migration_readiness_check.sh not found"
          fi

          if [[ -f "./2_migration.sh" ]]; then
            print_ok "2_migration.sh exists"
          else
            print_fail "2_migration.sh not found"
          fi

          if [[ -f "./3_post_migration_validation.sh" ]]; then
            print_ok "3_post_migration_validation.sh exists"
          else
            print_fail "3_post_migration_validation.sh not found"
          fi

          echo ""
          echo "Checking storage configuration..."
          echo "---------------------------------"

          STORAGE_TYPE="${STORAGE_TYPE:-GITHUB}"
          STORAGE_TYPE="$(echo "$STORAGE_TYPE" | tr '[:lower:]' '[:upper:]')"

          IS_DR="false"
          if [[ "${TARGET_GITHUB_API_URL}" =~ ^https://api\.[a-zA-Z0-9.-]+\.ghe\.com/?$ ]]; then
            IS_DR="true"
          fi

          if [[ "$STORAGE_TYPE" == "GITHUB" ]]; then
            print_ok "STORAGE_TYPE is GITHUB"

            if [[ "$IS_DR" == "true" ]]; then

              if [[ -n "${TARGET_UPLOAD_URL:-}" ]]; then
                print_ok "TARGET_UPLOAD_URL is configured for GitHub Enterprise Cloud Data Residency: ${TARGET_UPLOAD_URL}"

              elif [[ "${TARGET_GITHUB_API_URL}" =~ ^https://api\.([a-zA-Z0-9.-]+)\.ghe\.com/?$ ]]; then

                DR_SUBDOMAIN="${BASH_REMATCH[1]}"
                DEFAULT_UPLOAD_URL="https://uploads.${DR_SUBDOMAIN}.ghe.com"

                print_info "TARGET_UPLOAD_URL is not configured."
                print_info "Will auto-generate TARGET_UPLOAD_URL as: ${DEFAULT_UPLOAD_URL}"

              fi
            fi

          elif [[ "$STORAGE_TYPE" == "AZURE" ]]; then
            print_ok "STORAGE_TYPE is AZURE"

            if [[ -n "${AZURE_STORAGE_CONNECTION_STRING:-}" ]]; then
              print_ok "AZURE_STORAGE_CONNECTION_STRING is configured"
            else
              print_fail "AZURE_STORAGE_CONNECTION_STRING is required for STORAGE_TYPE=AZURE"
            fi

          elif [[ "$STORAGE_TYPE" == "AWS" ]]; then
            print_ok "STORAGE_TYPE is AWS"

            if [[ -n "${AWS_BUCKET_NAME:-}" ]]; then
              print_ok "AWS_BUCKET_NAME is configured: ${AWS_BUCKET_NAME}"
            else
              print_fail "AWS_BUCKET_NAME is required for STORAGE_TYPE=AWS"
            fi

            if [[ -n "${AWS_REGION:-}" ]]; then
              print_ok "AWS_REGION is configured: ${AWS_REGION}"
            else
              print_fail "AWS_REGION is required for STORAGE_TYPE=AWS"
            fi

            if [[ -n "${AWS_ACCESS_KEY_ID:-}" ]]; then
              print_ok "AWS_ACCESS_KEY_ID is configured"
            else
              print_fail "AWS_ACCESS_KEY_ID is required for STORAGE_TYPE=AWS"
            fi

            if [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
              print_ok "AWS_SECRET_ACCESS_KEY is configured"
            else
              print_fail "AWS_SECRET_ACCESS_KEY is required for STORAGE_TYPE=AWS"
            fi

            if [[ -n "${AWS_SESSION_TOKEN:-}" ]]; then
              print_ok "AWS_SESSION_TOKEN is configured"
            else
              print_info "AWS_SESSION_TOKEN is not configured. This is optional."
            fi

          else
            print_fail "Invalid STORAGE_TYPE: ${STORAGE_TYPE}. Allowed values: GITHUB, AZURE, AWS"
          fi

          echo ""
          echo "====================================="
          echo "Environment Validation Summary"
          echo "====================================="

          if [[ "$VALIDATION_FAILED" -ne 0 ]]; then
            echo "❌ Environment validation failed. Fix the errors above before continuing."
            exit 1
          fi

          echo "✅ Environment validation completed successfully."

  # ------------------------------------------------------------
  # 2) Migration Readiness Check
  # ------------------------------------------------------------
  migration-readiness-check:
    name: migration-readiness-check
    runs-on: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && inputs.SELF_HOSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && 7200 || 360 }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    needs: [env-validation]
    if: ${{ inputs.RUN_MIGRATION_READINESS == 'true' }}

    env:
      GITLAB_SERVER_URL: ${{ vars.GITLAB_SERVER_URL }}
      INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-prereqs

      - name: Run migration readiness check
        shell: bash
        run: |
          echo "Runner: $RUNNER_NAME | OS: $RUNNER_OS"
          echo "=================================="
          echo "# 3) Migration Readiness Check"
          echo "=================================="
          set -euo pipefail

          sed -i 's/\r$//' ./1_migration_readiness_check.sh
          chmod +x ./1_migration_readiness_check.sh

          ./1_migration_readiness_check.sh 2>&1 | tee 1_migration_readiness_check.out

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          CLEAN_FILE=$(mktemp)

          # Remove ANSI color codes from script output before writing to GitHub Summary
          sed -r 's/\x1B\[[0-9;]*[mK]//g' \
            1_migration_readiness_check.out > "$CLEAN_FILE"

          total_open_mrs=$(grep -c "^MR URL:" "$CLEAN_FILE" || true)
          total_running_pipelines=$(grep -c "^Pipeline URL:" "$CLEAN_FILE" || true)

          final_message="$(grep -E "Open merge requests or active pipelines found|No open merge requests or active pipelines detected|Validation checks could not be completed|Active items detected" "$CLEAN_FILE" | tail -n 1 || true)"

          {
            echo "## 🔎 Migration Readiness Summary"
            echo ""

            grep -E "Total rows processed|Skipped rows" "$CLEAN_FILE" || true
            echo ""

            if [[ "$total_open_mrs" -eq 0 ]]; then
              echo "Merge Requests       : None Detected"
            else
              echo "⚠️ Open Merge Requests Detected"
            fi

            if [[ "$total_running_pipelines" -eq 0 ]]; then
              echo "Pipelines            : None Detected"
            else
              echo "⚠️ Running/Pending Pipelines Detected"
            fi

            echo ""
            echo "Total Open MRs       : ${total_open_mrs}"
            echo "Total Running/Pending Pipelines : ${total_running_pipelines}"
            echo ""

            if [[ "$total_open_mrs" -gt 0 && "$total_open_mrs" -le 5 ]]; then
              echo "### Open Merge Request Details"
              echo ""

              awk '
                /^\[WARNING\] Detected Open Merge Request\(s\):/ {in_mr=1; next}
                /^Pipeline Summary|^\[WARNING\] Detected Running\/Pending Pipeline\(s\):/ {in_mr=0}
                in_mr && (/^Project:/ || /^MR URL:/) {print}
              ' "$CLEAN_FILE"

              echo ""
            elif [[ "$total_open_mrs" -gt 5 ]]; then
              echo "Open merge request details are not shown because more than 5 open MRs were detected."
              echo ""
            fi

            if [[ "$total_running_pipelines" -gt 0 && "$total_running_pipelines" -le 5 ]]; then
              echo "### Running/Pending Pipeline Details"
              echo ""

              awk '
                /^\[WARNING\] Detected Running\/Pending Pipeline\(s\):/ {in_pipe=1; next}
                /^Open merge requests|^No open merge requests|^Validation checks|^Active items detected/ {in_pipe=0}
                in_pipe && (/^Project:/ || /^Pipeline URL:/) {print}
              ' "$CLEAN_FILE"

              echo ""
            elif [[ "$total_running_pipelines" -gt 5 ]]; then
              echo "Pipeline details are not shown because more than 5 running/pending pipelines were detected."
              echo ""
            fi

            if [[ "$total_open_mrs" -gt 5 || "$total_running_pipelines" -gt 5 ]]; then
              echo "Review readiness artifacts for detailed repository-level findings."
              echo ""
            fi

            if [[ -n "$final_message" ]]; then
              echo "$final_message"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-readiness-check-artifacts
          retention-days: 7
          path: |
            1_migration_readiness_check.out
            logs/
            output_files/
            *.log

  # ------------------------------------------------------------
  # 3) Approval Stage
  # ------------------------------------------------------------
  approval-stage:
    name: approval-stage
    runs-on: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && inputs.SELF_HOSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 1440
    needs: 
      - migration-readiness-check
    if: ${{ inputs.RUN_MIGRATION_READINESS == 'true' }}
    environment:
      name: ${{ inputs.APPROVAL_ENVIRONMENT_NAME }}

    steps:
      - name: Download readiness artifacts
        uses: actions/download-artifact@v6
        with:
          name: migration-readiness-check-artifacts
          path: .

      - name: Approval notice
        shell: bash
        run: |
          echo "Runner: $RUNNER_NAME | OS: $RUNNER_OS"
          echo "===================================="
          echo "MANUAL APPROVAL REQUIRED"
          echo "===================================="
          echo "Review readiness check output before approving migration."
          echo ""
          echo "Review artifact:"
          echo " - 1_migration_readiness_check.out"
          echo ""
          echo "Approve this environment deployment to continue to repository migration."

  # ------------------------------------------------------------
  # 4) Migrating Repos
  # ------------------------------------------------------------
  migrate-repositories:
    name: migrate-repositories
    runs-on: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && inputs.SELF_HOSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && 7200 || 360 }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    needs:
      - env-validation
      - migration-readiness-check
      - approval-stage
    if: ${{ 
            always() &&
            needs.env-validation.result == 'success' &&
            (
              inputs.RUN_MIGRATION_READINESS == 'false' ||
              needs.approval-stage.result == 'success'
            )
        }}
    env:
      GITLAB_SERVER_URL: ${{ vars.GITLAB_SERVER_URL }}
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}

      TARGET_GITHUB_API_URL: ${{ vars.TARGET_GITHUB_API_URL }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}

      STORAGE_TYPE: ${{ vars.STORAGE_TYPE }}

      TARGET_UPLOAD_URL: ${{ vars.TARGET_UPLOAD_URL }}

      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

      AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-prereqs

      - uses: ./.github/actions/setup-gh
        with:
          gh-pat: ${{ secrets.GH_PAT }}
          github-api-url: ${{ vars.TARGET_GITHUB_API_URL }}

      - name: Run repository migration
        shell: bash
        run: |
          echo "Runner: $RUNNER_NAME | OS: $RUNNER_OS"
          echo "========================="
          echo "# 5) Migrating Repos"
          echo "========================="
          set -euo pipefail

          TARGET_GITHUB_API_URL="${TARGET_GITHUB_API_URL:-https://api.github.com}"

          sed -i 's/\r$//' ./2_migration.sh
          chmod +x ./2_migration.sh

          export GITHUB_API_URL="${TARGET_GITHUB_API_URL}"
          echo "GH API URL is: $GITHUB_API_URL"
          ./2_migration.sh 2>&1 | tee 2_migration.out

          echo ""
          echo "[INFO] Generated output files:"
          find output_files -type f -maxdepth 2 -print || true

      - name: Publish migration summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🚀 Migration Summary"
            echo ""

            if [[ -f output_files/migration/repos_with_status.csv ]]; then

              success_count=$(tail -n +2 output_files/migration/repos_with_status.csv | grep -c ",Success$" || true)
              failed_count=$(tail -n +2 output_files/migration/repos_with_status.csv | grep -c ",Failed$" || true)

              echo "- ✅ Success: ${success_count}"
              echo "- ❌ Failed: ${failed_count}"
              echo ""

              echo "| GitLab Repository | GitHub Repository | Status |"
              echo "|---|---|---|"

              tail -n +2 output_files/migration/repos_with_status.csv | while IFS=',' read -r gl_group gl_project gh_org gh_repo visibility status
              do
                echo "| \`${gl_group}/${gl_project}\` | \`${gh_org}/${gh_repo}\` | ${status} |"
              done

            else
              echo "⚠️ repos_with_status.csv not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload migration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-artifacts
          retention-days: 7
          path: |
            2_migration.out
            output_files/
            logs/
            *.log

  # ------------------------------------------------------------
  # 5) Post Migration Validation
  # ------------------------------------------------------------
  post-migration-validation:
    name: post-migration-validation
    runs-on: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && inputs.SELF_HOSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.USE_SELF_HOSTED_RUNNER == 'true' && 7200 || 360 }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    needs: [migrate-repositories]

    if: ${{ 
          always() &&
          needs.migrate-repositories.result == 'success'
        }}

    env:
      GITLAB_SERVER_URL: ${{ vars.GITLAB_SERVER_URL }}
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}

      TARGET_GITHUB_API_URL: ${{ vars.TARGET_GITHUB_API_URL }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}

      REPOS_STATUS_FILE: ${{ github.workspace }}/output_files/migration/repos_with_status.csv

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-prereqs

      - uses: ./.github/actions/setup-gh
        with:
          gh-pat: ${{ secrets.GH_PAT }}
          github-api-url: ${{ vars.TARGET_GITHUB_API_URL }}

      - name: Download migration artifacts
        uses: actions/download-artifact@v6
        with:
          name: migration-artifacts
          path: .

      - name: Run post-migration validation
        shell: bash
        run: |
          echo "Runner: $RUNNER_NAME | OS: $RUNNER_OS"
          echo "================================"
          echo "# 6) Post Migration Validation"
          echo "================================"
          set -euo pipefail

          TARGET_GITHUB_API_URL="${TARGET_GITHUB_API_URL:-https://api.github.com}"

          if [[ ! -f "$REPOS_STATUS_FILE" ]]; then
            echo "[ERROR] repos_with_status.csv not found: $REPOS_STATUS_FILE"
            echo "[INFO] Available files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          sed -i 's/\r$//' ./3_post_migration_validation.sh
          chmod +x ./3_post_migration_validation.sh

          export GITHUB_API_URL="${TARGET_GITHUB_API_URL}"
          echo "GH API URL is: $GITHUB_API_URL"
          
          # ✅ Authenticate to GitHub host
          unset GH_TOKEN
          export TARGET_GITHUB_API_URL="${TARGET_GITHUB_API_URL:-}"
          if [[ -n "${TARGET_GITHUB_API_URL:-}" ]]; then
              GH_HOST="$(echo "$TARGET_GITHUB_API_URL" | sed -E 's#https://api\.##')"
              echo "$GH_PAT" | gh auth login --with-token --hostname "$GH_HOST"
          else
              echo "$GH_PAT" | gh auth login --with-token
          fi
          gh auth status
          
          ./3_post_migration_validation.sh 2>&1 | tee 3_post_migration_validation.out

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          latest_md=$(find output_files/post_migration_validation \
            -name "validation-summary_*.md" \
            | sort | tail -n 1)

          if [[ -f "$latest_md" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$latest_md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 🔎 Post Migration Validation Summary"
              echo ""
              echo "⚠️ Validation summary file not found"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-migration-validation-artifacts
          retention-days: 7
          path: |
            3_post_migration_validation.out
            output_files/
            logs/
            *.log
